<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이쌤 학생관리</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a6cf7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이쌤학생관리">
<style>
body{font-family:sans-serif;margin:0;background:#f4f6fb}
header{background:#4a6cf7;color:#fff;padding:14px;font-size:20px;text-align:center}
.box{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 1px 4px #0002}
select,input,textarea,button{font-size:16px;width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:8px;border:1px solid #ccc}
button{background:#4a6cf7;color:#fff;border:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0}
.tabs.in{padding:6px 0}
.tab{width:auto;white-space:nowrap;background:#dfe5fb;color:#334;padding:8px 14px;margin:0}
.tab.act{background:#4a6cf7;color:#fff;font-weight:bold}
.tab.add{background:#fff;color:#4a6cf7;border:1px dashed #4a6cf7}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.row span{flex:1}
.row button{width:auto;padding:8px 12px;margin:0}
.row input[type=checkbox]{width:24px;height:24px;margin:0}
.row input.mini{margin:0;padding:6px}
.row.abs{background:#fff4e5}
.on{background:#2ecc71}.del{background:#e74c3c}.sent{background:#999}.gray{background:#8a94a6}
.start{border-left:6px solid #f39c12}.late{border-left:6px solid #3498db}.btnL{background:#3498db}.end{border-left:6px solid #2ecc71}
.btnS{background:#f39c12}.today{background:#eaf7ef;border-radius:8px;padding:8px;margin:6px 0}.lessonBox{border-left:6px solid #9b59b6}
.small{display:flex;gap:6px}.small button{font-size:13px;padding:6px}
#check{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
#check .row{border:1px solid #e3e7f2;border-radius:8px;padding:8px 6px;gap:6px;min-width:0}
#check .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#check .row input[type=checkbox]{width:20px;height:20px;flex:none}
#check .row.abs{border-color:#f39c12}
#check > small{grid-column:1/-1}
.tabwrap{margin:12px 12px 0}
#schoolTabs{display:flex;gap:4px;overflow-x:auto;align-items:flex-end}
#schoolTabs .tab{border-radius:10px 10px 0 0;padding:10px 16px;margin:0}
#schoolTabs .tab.act{background:#fff;color:#4a6cf7;font-weight:bold}
#schoolTabs .tab.add{background:transparent;border:1px dashed #4a6cf7;border-bottom:none;padding:8px 14px}
.panel{background:#fff;border-radius:0 12px 12px 12px;padding:12px 14px;box-shadow:0 3px 4px -2px #0002}
.panel .tabs{padding:0}
.yearbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 12px 0}
.yearbar button{width:auto;padding:6px 14px;margin:0;background:#dfe5fb;color:#334}
.yearbar button:disabled{opacity:.35}
.yearbar b{font-size:18px}
.notiBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px}.notiBtns button{margin:0;font-size:15px}
.notice{border-left:6px solid #e67e22}.btnN{background:#e67e22}
.badge{font-style:normal;font-size:12px;background:#fdebd3;color:#b9650b;border-radius:10px;padding:3px 8px;white-space:nowrap}
.trio{display:flex;gap:6px;margin-top:6px}.trio button{flex:1;font-size:14px;padding:8px 4px;margin:0}
.sub{border:1px solid #e3e7f2;border-radius:10px;padding:10px;margin:10px 0}
small{color:#666}
details summary{cursor:pointer;font-weight:bold}
.ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:9}
.mbox{background:#fff;border-radius:12px;padding:18px;width:80%;max-width:340px}
</style>
</head>
<body>
<header>이쌤 학생관리</header>

<div class="yearbar">
  <button id="yPrev" onclick="goYear(-1)">◀</button>
  <b id="yearLabel"></b>
  <button id="yNext" onclick="goYear(1)">▶</button>
</div>
<div class="tabwrap">
  <div id="schoolTabs"></div>
  <div class="panel">
  <div id="addSchoolBox" style="display:none;margin-top:8px">
    <input id="newSchool" placeholder="학교 이름 (예: 속초초)" lang="ko" autocomplete="off" autocapitalize="off">
    <button onclick="addSchool()">학교 추가</button>
  </div>
  <b id="schoolTitle" style="display:none;margin-top:8px"></b>
  <div class="tabs in" id="partTabs"></div>
  <div id="renameBox" style="display:none;margin-top:8px">
    <input id="newPartName" lang="ko" autocomplete="off" placeholder="새 이름 (예: 1부 방학)">
    <div class="small"><button class="gray" onclick="renameBox.style.display='none'">취소</button><button onclick="renamePart()">이름 바꾸기</button></div>
  </div>
  <div class="small" id="schoolTools"></div>
  </div>
</div>

<div class="box">
  <b>출석 체크</b>
  <div id="check"></div>
</div>

<div class="box start">
  <b>수업 시작 — 결석 알림</b>
  <div class="sub">
    <b>📨 한꺼번에 보내기</b>
    <textarea id="msgAB" rows="2" oninput="saveMsg()"></textarea>
    <div id="bulkABtn"></div>
  </div>
  <details class="sub">
    <summary>👤 한 명씩 보내기</summary>
    <textarea id="msgA" rows="3" oninput="saveMsg()"></textarea>
    <div id="sendA"></div>
  </details>
</div>

<div class="box late">
  <b>늦게 온 아이 — 출석 알림</b>
  <textarea id="msgL" rows="3" oninput="saveMsg()"></textarea>
  <div id="sendL"></div>
</div>

<div class="box end">
  <b>수업 끝 — 귀가 알림</b>
  <div id="todayLesson"></div>
  <div class="sub">
    <b>📨 한꺼번에 보내기</b>
    <textarea id="msgB" rows="2" oninput="saveMsg()"></textarea>
    <div id="bulkBtn"></div>
  </div>
  <details class="sub">
    <summary>👤 한 명씩 보내기</summary>
    <textarea id="msgE" rows="3" oninput="saveMsg()"></textarea>
    <div id="sendE"></div>
  </details>
</div>

<div class="box notice">
  <details id="noticeBox">
    <summary>📢 단체 공지</summary>
    <textarea id="msgN" rows="5" lang="ko" placeholder="공지 내용을 적어 주세요" oninput="localStorage.setItem('attMsgN', msgN.value)"></textarea>
    <div id="noticeBtn"></div>
  </details>
</div>

<div class="box">
  <details id="rosterBox">
    <summary id="listTitle">학생 명단</summary>

    <div class="sub">
      <b>📷 명단 사진으로 한 번에 추가</b>
      <input type="file" id="photo" accept="image/*,application/pdf" onchange="readPhoto(this)">
      <div id="aiStatus"></div>
      <div id="aiResult"></div>
    </div>

    <div class="sub">
      <b>✏️ 한 명씩 추가</b>
      <input id="sName" placeholder="학생 이름" lang="ko" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input id="sPhone" placeholder="학부모 전화번호 (010-0000-0000)" type="tel" oninput="liveFmt(this)">
      <button id="stuBtn" onclick="addStu()">학생 추가</button>
      <button id="pickBtn" class="gray" onclick="pickContacts()" style="display:none">📱 휴대폰 연락처에서 불러오기</button>
    </div>

    <b>지금 명단</b>
  <div id="list"></div>
    <button class="gray" onclick="exportVcf()">📇 이 명단을 휴대폰 연락처 파일로 저장</button>

    <details class="sub">
      <summary>⚙️ AI 설정</summary>
      <input id="apiKey" placeholder="Gemini API 키" oninput="localStorage.setItem('attKey', apiKey.value.trim())">
    </details>
  </details>
</div>

<div class="box lessonBox">
  <details id="lessonDet">
    <summary id="lessonTitle">📅 수업 내용</summary>
    <div class="sub">
      <b>하루씩 넣기</b>
      <input type="date" id="lDate">
      <input id="lText" placeholder="수업 내용 (예: 로봇 팔 만들기)" lang="ko" autocomplete="off">
      <button id="lBtn" onclick="addLesson()">수업 내용 저장</button>
    </div>
    <div class="sub">
      <b>한 달 치 한 번에 넣기</b>
      <textarea id="lBulk" rows="4" lang="ko" placeholder="11/12 로봇 팔 만들기&#10;11/19 센서 자동차&#10;11/26 코딩 미로 탈출"></textarea>
      <button onclick="addLessonBulk()">한 번에 저장</button>
    </div>
    <div id="lessonList"></div>
  </details>
</div>

<div class="box">
  <b>💾 백업 · 복구 · 초기화</b>
  <div class="trio">
    <button onclick="backup()">💾 백업</button>
    <button class="gray" onclick="restore()">📂 복구</button>
    <button class="del" onclick="resetAll()">🗑 초기화</button>
  </div>
  <input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restoreFromFile(this.files[0]); this.value=''">
  <div id="backupTip"></div>
</div>

<div class="ov" id="modal"><div class="mbox"><p id="mMsg"></p>
<div class="small"><button id="mNo" class="gray">취소</button><button id="mYes">확인</button></div></div></div>

<script>
// ---------- 확인창 ----------
function ask(msg, yes){
  mMsg.textContent = msg; mNo.style.display = yes ? 'block' : 'none';
  modal.style.display = 'flex';
  mYes.onclick = () => { modal.style.display = 'none'; if(yes) yes(); };
  mNo.onclick = () => { modal.style.display = 'none'; };
}
function tell(msg){ ask(msg, null); }

// ---------- 저장 ----------
// { "2026": { 학교이름: { "1부": [{name, phone}], "2부": [...] } } }
let curY = localStorage.getItem('attCurY') || String(new Date().getFullYear());
let years = JSON.parse(localStorage.getItem('attYears') || 'null');
if(!years){ // 예전 버전 자료를 올해로 옮김
  let old = JSON.parse(localStorage.getItem('attDB') || 'null');
  if(!old){
    old = {};
    const older = JSON.parse(localStorage.getItem('attData') || '{}');
    for(const k in older) old[k] = {'1부': older[k], '2부': []};
  }
  years = {[curY]: old};
}
if(!years[curY]) years[curY] = {};
let db = years[curY];
let curS = localStorage.getItem('attCurS') || '';
let curP = localStorage.getItem('attCurP') || '1부';
let editIdx = -1;
let aiRows = [];
// { "학교|부": { "2026-11-12": "로봇 팔 만들기" } }
// { "2026": { "학교|부": { "2026-11-12": "로봇 팔 만들기" } } }
let lessonsY = JSON.parse(localStorage.getItem('attLessonsY') || 'null');
if(!lessonsY) lessonsY = {[curY]: JSON.parse(localStorage.getItem('attLessons') || '{}')};
function saveLessons(){ localStorage.setItem('attLessonsY', JSON.stringify(lessonsY)); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const todayKey = ymd(new Date());
apiKey.value = localStorage.getItem('attKey') || '';

msgA.value = localStorage.getItem('attMsgA') || '안녕하세요. 이름이(가) 아직 방과후 수업에 들어오지 않았습니다. 확인 부탁드립니다.';
msgL.value = localStorage.getItem('attMsgL') || '안녕하세요. 이름이(가) 조금 늦었지만 지금 방과후 수업에 들어왔습니다. 걱정하지 않으셔도 됩니다.';
msgN.value = localStorage.getItem('attMsgN') || '';
msgAB.value = localStorage.getItem('attMsgAB') || '안녕하세요. 자녀가 아직 방과후 수업에 들어오지 않았습니다. 확인 부탁드립니다.';
msgB.value = localStorage.getItem('attMsgB') || '안녕하세요. 오늘 방과후 수업을 잘 마치고 아이들이 귀가했습니다. 감사합니다.';
msgE.value = localStorage.getItem('attMsgE') || '안녕하세요. 이름이(가) 오늘 방과후 수업을 잘 마치고 귀가했습니다.';

const today = new Date().toLocaleDateString('ko-KR');
let day = JSON.parse(localStorage.getItem('attDay') || '{}');
if(day.date !== today || !day.v2) day = {date: today, v2: true, cls: {}};

if('contacts' in navigator && 'ContactsManager' in window) pickBtn.style.display = 'block';

function save(){
  localStorage.setItem('attYears', JSON.stringify(years));
  localStorage.setItem('attCurY', curY);
  localStorage.setItem('attCurS', curS);
  localStorage.setItem('attCurP', curP);
}
function saveDay(){ localStorage.setItem('attDay', JSON.stringify(day)); }
function saveMsg(){
  localStorage.setItem('attMsgA', msgA.value);
  localStorage.setItem('attMsgE', msgE.value);
  localStorage.setItem('attMsgL', msgL.value);
  localStorage.setItem('attMsgB', msgB.value);
  localStorage.setItem('attMsgAB', msgAB.value);
}
function stuList(){ return (db[curS] && db[curS][curP]) || []; }
function dayKey(p){ return curY + '|' + curS + '|' + (p || curP); }
function st(){
  const k = dayKey();
  if(!day.cls[k]) day.cls[k] = {absent:{}, sentA:{}, sentE:{}, sentL:{}};
  if(!day.cls[k].sentL) day.cls[k].sentL = {};
  if(!day.cls[k].bulkA) day.cls[k].bulkA = {};
  return day.cls[k];
}
function resetDay(){ delete day.cls[dayKey()]; saveDay(); }
function onlyNum(p){ return String(p || '').replace(/[^0-9]/g,''); }
function fmtPhone(p){ // 01012345678 → 010-1234-5678
  const d = onlyNum(p);
  if(d.startsWith('02')){
    if(d.length === 9)  return d.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
    if(d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
  }
  if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if(d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  return d;
}
function liveFmt(el){ el.value = fmtPhone(el.value); }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 학교·부 ----------
function openAddSchool(){
  addSchoolBox.style.display = addSchoolBox.style.display === 'none' ? 'block' : 'none';
  if(addSchoolBox.style.display === 'block') newSchool.focus();
}
function addSchool(){
  const n = newSchool.value.trim();
  if(!n) return tell('학교 이름을 넣어 주세요');
  if(db[n]) return tell('이미 있는 학교예요');
  db[n] = {'1부': [], '2부': []};
  newSchool.value = ''; addSchoolBox.style.display = 'none';
  curS = n; curP = '1부'; save(); clearSide(); draw();
}
function firstPart(){ return (db[curS] && Object.keys(db[curS])[0]) || '1부'; }
function selS(i){ curS = Object.keys(db)[i]; curP = firstPart(); save(); clearSide(); draw(); }
function delSchool(){
  ask(curS + '을(를) 명단까지 모두 삭제할까요?', () => {
    delete db[curS]; curS = Object.keys(db)[0] || ''; curP = firstPart(); save(); clearSide(); draw();
  });
}
function selP(i){ curP = Object.keys(db[curS])[i]; save(); clearSide(); draw(); }
function nextPartName(){
  let i = Object.keys(db[curS]).length + 1;
  while(db[curS][i + '부']) i++;
  return i + '부';
}
function addPart(){
  const n = nextPartName();
  db[curS][n] = []; curP = n; save(); clearSide(); draw();
}
function delPart(){
  const parts = Object.keys(db[curS]), last = parts[parts.length - 1];
  ask(last + '을(를) 명단까지 삭제할까요?', () => {
    delete db[curS][last]; curP = firstPart(); save(); clearSide(); draw();
  });
}
function openRename(){
  renameBox.style.display = renameBox.style.display === 'none' ? 'block' : 'none';
  newPartName.value = curP; newPartName.focus();
}
function renamePart(){
  const n = newPartName.value.trim();
  if(!n) return tell('이름을 넣어 주세요');
  if(n === curP){ renameBox.style.display = 'none'; return; }
  if(db[curS][n]) return tell('이미 있는 이름이에요');
  const o = {}; // 순서를 그대로 두고 이름만 바꿈
  for(const k of Object.keys(db[curS])) o[k === curP ? n : k] = db[curS][k];
  db[curS] = o;
  const L = lessonsY[curY] || {};
  if(L[curS + '|' + curP]){ L[curS + '|' + n] = L[curS + '|' + curP]; delete L[curS + '|' + curP]; saveLessons(); }
  if(day.cls[dayKey()]){ day.cls[dayKey(n)] = day.cls[dayKey()]; delete day.cls[dayKey()]; saveDay(); }
  curP = n; renameBox.style.display = 'none'; save(); draw();
}

// ---------- 연도 ----------
function goYear(d){
  const ys = Object.keys(years).sort();
  const i = ys.indexOf(curY);
  if(d < 0){ if(i > 0) switchYear(ys[i - 1]); return; }
  if(i < ys.length - 1) return switchYear(ys[i + 1]);
  const ny = String(+curY + 1);
  ask(`${ny}년을 새로 만들까요?\n학교와 부 이름은 그대로 가져오고, 학생 명단과 수업 내용은 비어 있어요.\n${curY}년 자료는 ◀를 누르면 다시 볼 수 있어요.`, () => {
    const copy = {};
    for(const sc of Object.keys(db)){ copy[sc] = {}; for(const p of Object.keys(db[sc])) copy[sc][p] = []; }
    years[ny] = copy; switchYear(ny);
  });
}
function switchYear(y){
  curY = y; db = years[curY];
  curS = Object.keys(db)[0] || ''; curP = firstPart();
  save(); clearSide(); draw();
}

function clearSide(){
  editIdx = -1; stuBtn.textContent = '학생 추가';
  aiRows = []; aiResult.innerHTML = ''; aiStatus.innerHTML = '';
  renameBox.style.display = 'none';
}

// ---------- 한 명씩 추가·수정·삭제 ----------
function addStu(){
  if(!curS) return tell('먼저 위에서 학교를 추가하세요');
  const n = sName.value.trim(), p = onlyNum(sPhone.value);
  if(!n || !p) return tell('이름과 전화번호를 모두 넣어 주세요');
  if(editIdx >= 0){ stuList()[editIdx] = {name:n, phone:p}; editIdx = -1; stuBtn.textContent = '학생 추가'; }
  else stuList().push({name:n, phone:p});
  save(); sName.value = ''; sPhone.value = ''; draw();
}
function editStu(i){
  const s = stuList()[i];
  sName.value = s.name; sPhone.value = fmtPhone(s.phone); editIdx = i;
  stuBtn.textContent = '수정 완료'; sName.focus();
}
function delStu(i){
  ask(stuList()[i].name + '을(를) 명단에서 삭제할까요?', () => {
    stuList().splice(i,1); save(); resetDay(); draw();
  });
}
async function pickContacts(){
  if(!curS) return tell('먼저 위에서 학교를 추가하세요');
  try{
    const cs = await navigator.contacts.select(['name','tel'], {multiple:true});
    cs.forEach(c => {
      const tel = onlyNum(c.tel && c.tel[0]);
      if(tel) stuList().push({name: (c.name && c.name[0]) || tel, phone: tel});
    });
    save(); draw();
    if(cs.length) tell('불러왔어요. 연락처 이름이 "민수 엄마"처럼 되어 있으면 "수정"을 눌러 아이 이름으로 바꿔 주세요.');
  }catch(e){}
}

// ---------- 연락처 파일(vcf) 만들기 ----------
function exportVcf(){
  const L = stuList();
  if(!L.length) return tell('명단에 학생이 없어요');
  const group = `${curS} ${curP}`, tag = `${curS}${curP}`;
  const v = t => String(t).replace(/([,;\\])/g, '\\$1');
  const cards = L.map(p => [
    'BEGIN:VCARD', 'VERSION:3.0',
    `FN:${v(p.name)} 학부모(${v(tag)})`,
    `N:${v(p.name)} 학부모(${v(tag)});;;;`,
    `TEL;TYPE=CELL:${fmtPhone(p.phone)}`,
    `ORG:${v(group)}`,
    `CATEGORIES:${v(group)}`,
    `NOTE:이쌤 학생관리 - ${v(group)}`,

// ---------- 사진으로 명단 추가 (Gemini) ----------
const MODELS = ['gemini-3.1-flash-lite', 'gemini-flash-latest', 'gemini-2.5-flash'];

function shrink(file){ // 사진을 작게 줄여서 보냄 (10초 안에 안 되면 실패 처리)
  return new Promise((ok, no) => {
    const timer = setTimeout(() => no(new Error('사진을 열지 못했어요. 다른 사진(캡처 화면)으로 해 보세요.')), 10000);
    const img = new Image();
    img.onload = () => {
      clearTimeout(timer);
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { clearTimeout(timer); no(new Error('이 사진 형식은 열 수 없어요. 화면 캡처(JPG·PNG)로 해 보세요.')); };
    img.src = URL.createObjectURL(file);
  });
}
function fileB64(file){ // PDF는 그대로 보냄
  return new Promise((ok, no) => {
    const rd = new FileReader();
    rd.onload = () => ok(rd.result.split(',')[1]);
    rd.onerror = () => no(new Error('파일을 읽지 못했어요'));
    rd.readAsDataURL(file);
  });
}
let aiTimer = null;
function aiStep(msg){
  clearInterval(aiTimer);
  const t0 = Date.now();
  const show = () => aiStatus.innerHTML = `<small>⏳ ${msg} (${Math.round((Date.now()-t0)/1000)}초)</small>`;
  show(); aiTimer = setInterval(show, 1000);
}
async function callGemini(model, key, parts){
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), 60000); // 60초 넘으면 멈춤
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({contents: [{parts}], generationConfig: {responseMimeType: 'application/json', temperature: 0}})
    });
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) return {err: (j.error && j.error.message) || ('오류 ' + res.status), status: res.status};
    const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    return text ? {text} : {err: 'AI가 빈 답을 보냈어요'};
  }catch(e){
    return {err: e.name === 'AbortError' ? '60초가 지나도 답이 없어요' : '인터넷 연결을 확인해 주세요 (' + e.message + ')'};
  }finally{ clearTimeout(stop); }
}
async function readPhoto(input){
  const file = input.files[0]; input.value = '';
  if(!file) return;
  if(!curS) return tell('먼저 위에서 학교를 추가하세요');
  const key = apiKey.value.trim();
  if(!key) return tell('아래 "AI 설정"에 Gemini API 키를 먼저 넣어 주세요');
  aiResult.innerHTML = '';
  const prompt = '이 자료는 학생 명단입니다. 학생 이름과 학부모(보호자) 전화번호를 찾아 ' +
    'JSON 배열로만 답하세요. 예: [{"name":"홍길동","phone":"01012345678"}] ' +
    '전화번호가 여러 개면 학부모 번호 하나만 넣고, 번호가 없으면 phone은 빈 문자열로 하세요.';
  try{
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    aiStep(isPdf ? 'PDF를 준비하고 있어요' : '사진을 준비하고 있어요');
    const data = isPdf ? await fileB64(file) : await shrink(file);
    const parts = [{text: prompt}, {inline_data: {mime_type: isPdf ? 'application/pdf' : 'image/jpeg', data}}];

    let out = null, errs = [];
    for(const m of MODELS){
      aiStep('AI가 명단을 읽고 있어요');
      out = await callGemini(m, key, parts);
      if(out.text) break;
      errs.push(out.err);
      if(out.status === 400 && /key/i.test(out.err)) break;   // 키 문제는 다른 AI로 해도 같음
      if(out.status === 403) break;
    }
    clearInterval(aiTimer);
    if(!out || !out.text) throw new Error(errs[errs.length - 1] || '응답 없음');

    const m = out.text.match(/\[[\s\S]*\]/);
    const arr = JSON.parse(m ? m[0] : out.text);
    aiRows = arr.map(r => ({name: String(r.name || '').trim(), phone: onlyNum(r.phone), ok: true}))
                .filter(r => r.name);
    aiStatus.innerHTML = aiRows.length
      ? `<small>✅ ${aiRows.length}명을 찾았어요. 틀린 곳은 고치고, 넣지 않을 아이는 체크를 빼 주세요.</small>`
      : '<small>이름을 찾지 못했어요. 명단 부분만 크게 캡처해서 다시 해 보세요.</small>';
    drawAI();
  }catch(e){
    clearInterval(aiTimer);
    let hint = '';
    if(/API key not valid|API_KEY_INVALID/i.test(e.message)) hint = 'API 키가 틀렸어요. 앞뒤 빈칸 없이 다시 붙여 넣어 주세요.';
    else if(/quota|429|exhausted/i.test(e.message)) hint = '무료 사용량을 넘었어요. 잠시 뒤나 내일 다시 해 보세요.';
    else if(/not found|404/i.test(e.message)) hint = 'AI 이름이 바뀐 것 같아요. 이 화면을 캡처해서 알려 주세요.';
    aiStatus.innerHTML = `<small>❌ 읽지 못했어요: ${esc(e.message)}${hint ? '<br>' + hint : ''}</small>`;
  }
}

      <input class="mini" value="${esc(r.name)}" oninput="aiRows[${i}].name=this.value" style="flex:1">

function josa(word){ // 을/를 자동으로 고르기
  const c = word.charCodeAt(word.length - 1);
  if(c < 0xAC00 || c > 0xD7A3) return '을(를)';
  return (c - 0xAC00) % 28 ? '을' : '를';
}
function withLesson(text){
  const ls = todayLessonText();

  if(text.includes('수업내용')) return text.replaceAll('수업내용', ls);
  return text.trim() + ` 오늘은 ${ls}${josa(ls)} 배웠습니다.`;
}

function safeBody(text){

}

function givenName(full){ // 김민수 → 민수, 남궁민수 → 민수, 이준 → 이준
  const n = String(full).trim();
  if(!/^[가-힣]+$/.test(n)) return n;
  if(n.length === 3) return n.slice(1);
  if(n.length === 4) return n.slice(2);
  return n;
}
function hasBatchim(w){
  const c = w.charCodeAt(w.length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
}
function fillName(text, full){ // "이름이(가)" → 민수가 / 지훈이가
  const g = givenName(full), b = hasBatchim(g), base = b ? g + '이' : g;
  return text
    .replace(/이름이\(가\)/g, base + '가')
    .replace(/이름은\(는\)/g, base + '는')
    .replace(/이름을\(를\)/g, base + '를')
    .replace(/이름의/g, base + '의')
    .replace(/이름/g, base);
}

const canPickFolder = 'showSaveFilePicker' in window;
function backupName(){
  const d = new Date();
  return `출석관리_${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
}
function attKeys(){ // API 키는 백업에 넣지 않음
  return Object.keys(localStorage).filter(k => k.startsWith('att') && k !== 'attKey');
}
async function backup(){
  const data = {app: '출석관리', saved: new Date().toISOString(), items: {}};
  attKeys().forEach(k => data.items[k] = localStorage.getItem(k));
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  if(canPickFolder){ // 컴퓨터 크롬·엣지: 저장할 폴더를 묻는 창
    try{
      const h = await showSaveFilePicker({
        id: 'attBackup', suggestedName: backupName(), startIn: 'documents',
        types: [{description: '출석관리 백업', accept: {'application/json': ['.json']}}]
      });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return tell('백업했어요: ' + h.name);
    }catch(e){ if(e.name === 'AbortError') return; }
  }
  // 휴대폰: 다운로드로 저장
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = backupName();
  document.body.appendChild(a); a.click(); a.remove();
  tell(backupName() + ' 파일을 저장했어요. 저장 폴더를 고르는 창이 안 떴다면 "다운로드" 폴더에 있어요.');
}
async function restore(){
  if('showOpenFilePicker' in window){ // 백업할 때 고른 폴더가 먼저 열림
    try{
      const [h] = await showOpenFilePicker({
        id: 'attBackup', startIn: 'documents',
        types: [{description: '출석관리 백업', accept: {'application/json': ['.json']}}]
      });
      return restoreFromFile(await h.getFile());
    }catch(e){ if(e.name === 'AbortError') return; }
  }
  restoreFile.click(); // 휴대폰: 최근 폴더가 먼저 보이고, 없으면 직접 고르기
}
function restoreFromFile(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try{ data = JSON.parse(rd.result); }catch(e){ return tell('백업 파일이 아니에요'); }
    if(!data || data.app !== '출석관리' || !data.items) return tell('출석관리 백업 파일이 아니에요');
    const when = (data.saved || '').slice(0,10);
    ask(`${file.name} (${when} 백업)으로 복구할까요?\n지금 들어 있는 내용은 이 파일 내용으로 바뀌어요.`, () => {
      attKeys().forEach(k => localStorage.removeItem(k));
      for(const k in data.items) if(k !== 'attKey') localStorage.setItem(k, data.items[k]);
      location.reload();
    });
  };
  rd.readAsText(file);
}

  check.innerHTML = L.map((s,i) =>
    `<label class="row ${t.absent[i]?'abs':''}">
      <input type="checkbox" ${t.absent[i]?'checked':''} onchange="toggleAbs(${i}, this.checked)">
      <span>${esc(s.name)}</span>
    </label>`).join('')
    || '<small>학생 명단을 먼저 넣어 주세요</small>';

  sendA.innerHTML = L.map((s,i) => t.absent[i] ?
    `<div class="row"><span>${esc(s.name)}</span>${t.bulkA[i] ? '<em class="badge">단체 보냄</em>' : ''}
     <button class="${t.sentA[i]?'sent':'btnS'}" onclick="sendOne(${i},'A')">${t.sentA[i]?'보냄':'결석 문자'}</button></div>` : '').join('')
    || '<small>결석한 아이가 없어요 👍</small>';
  const absN = L.filter((s,i) => t.absent[i]).length, bi = t.bulkAInfo;
  bulkABtn.innerHTML = absN ? `<button class="btnS" onclick="sendBulkA()">결석 문자 한꺼번에 보내기 (${absN}명)</button>` : '<small>결석한 아이가 없어요 👍</small>';
  sendL.innerHTML = L.map((s,i) => ((t.sentA[i] || t.bulkA[i]) && !t.absent[i]) ?
    `<div class="row"><span>${esc(s.name)}</span>
     <button class="${t.sentL[i]?'sent':'btnL'}" onclick="sendOne(${i},'L')">${t.sentL[i]?'보냄':'출석 문자'}</button></div>` : '').join('')
    || '<small>늦게 온 아이가 없어요</small>';
  const lm = curS ? lessonMap() : {};
  const days = Object.keys(lm).sort();
  lessonTitle.textContent = curS ? `📅 ${curS} ${curP} 수업 내용 (${days.length}개)` : '📅 수업 내용';
  lessonList.innerHTML = days.map(d =>
    `<div class="row" ${d===todayKey?'style="background:#eaf7ef"':''}><span><b>${d.slice(5).replace('-','/')}</b> ${esc(lm[d])}${d===todayKey?' <small>← 오늘</small>':''}</span>
     <button class="gray" onclick="editLesson('${d}')">수정</button>
     <button class="del" onclick="delLesson('${d}')">삭제</button></div>`).join('')
    || '<small>아직 적어 둔 수업 내용이 없어요</small>';
  const raw = rawTodayLesson(), tl = todayLessonText();
  todayLesson.innerHTML = !raw
    ? '<div class="today" style="background:#f4f4f4"><small>오늘 날짜에 적어 둔 수업 내용이 없어요</small></div>'
    : `<div class="today" ${tl?'':'style="background:#f4f4f4"'}>📚 오늘 수업 내용: <b>${esc(raw)}</b><br>
       <label><input type="checkbox" style="width:auto;margin:6px 6px 0 0" ${tl?'checked':''} onchange="toggleNoLesson(this.checked)">오늘 문자에 수업 내용 넣기</label></div>`;

  noticeBtn.innerHTML = curS ? `<div class="notiBtns">` + Object.keys(db[curS]).map((p,i) =>
    `<button class="btnN" onclick="sendNotice(${i})">${esc(p)}에 보내기 (${noticePhones(p).length}명)</button>`).join('') + `</div>` : '';
  const n = L.filter((s,i) => !t.absent[i]).length;
  bulkBtn.innerHTML = n ? `<button class="on" onclick="sendBulk()">귀가 문자 한꺼번에 보내기 (${n}명)</button>` : '';
  sendE.innerHTML = L.map((s,i) => !t.absent[i] ?
    `<div class="row"><span>${esc(s.name)}</span>
     <button class="${t.sentE[i]?'sent':'on'}" onclick="sendOne(${i},'E')">${t.sentE[i]?'보냄':'귀가 문자'}</button></div>` : '').join('')
    || '<small>귀가 문자를 보낼 아이가 없어요</small>';
}
lDate.value = todayKey;
backupTip.innerHTML = '';
draw();
if(!Object.keys(db).length) addSchoolBox.style.display = 'block';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
